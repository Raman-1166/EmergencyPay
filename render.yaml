# Render Blueprint for EmergencyPay
# This file deploys Frontend, Backend, and a PostgreSQL Database.

database:
  name: emergencypay-db
  databaseName: emergencypay_db
  user: emergencypay_user
  plan: free

services:
  # 1. Backend Web Service (Spring Boot)
  - type: web
    name: emergencypay-backend
    env: docker
    region: ohio
    plan: free
    rootDir: backend
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: emergencypay-db
          property: connectionString
      - key: DB_USER
        fromDatabase:
          name: emergencypay-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: emergencypay-db
          property: password

  # 2. Frontend Static Site (React/Vite)
  - type: web
    name: emergencypay-dashboard
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: emergencypay-backend
          property: host
