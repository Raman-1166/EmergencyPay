spring.application.name=emergencypay-backend

# Database connection settings (PostgreSQL for Render)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emergencypay_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server configuration
server.port=${PORT:8080}

# SQL Init
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Management & Health Checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
