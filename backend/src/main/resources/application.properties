spring.application.name=emergencypay-backend

# Database connection settings
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/emergencypay_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:raman}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server configuration (Using 8080 by default, can be changed via environment variable)
server.port=${PORT:8080}

# SQL Init
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# Management & Health Checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
